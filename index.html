<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Wissenswerkstatt – Weiterleitung</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; display: flex; flex-direction: column;
         align-items: center; justify-content: center; min-height: 100vh;
         background: linear-gradient(135deg, #047857 0%, #059669 100%);
         color: #fff; text-align: center; padding: 20px; }
  h1 { font-size: 24pt; margin-bottom: 12px; }
  p { font-size: 13pt; opacity: 0.9; margin-bottom: 20px; max-width: 480px; }
  .spinner { width: 40px; height: 40px; border: 5px solid rgba(255,255,255,.25);
             border-top-color: #fff; border-radius: 50%;
             animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .url { font-family: monospace; font-size: 10pt; opacity: 0.7; word-break: break-all;
         max-width: 420px; margin-top: 12px; }
  .error { background: rgba(255,255,255,.15); border-radius: 12px; padding: 16px;
           max-width: 400px; margin-top: 12px; }
</style>
</head>
<body>

<h1>🔬 Wissenswerkstatt</h1>
<p id="status">Du wirst weitergeleitet …</p>
<div class="spinner" id="spinner"></div>
<div class="url" id="url-info"></div>

<div class="error" id="error-box" style="display:none">
  <p><strong>⚠️ Keine Verbindung möglich</strong></p>
  <p style="font-size:10pt;margin-top:8px">
    Die Wissenswerkstatt ist momentan nicht erreichbar.<br/>
    Bitte den Workshopleiter informieren.
  </p>
</div>

<script>
// =========================================================================
// Stabiler Redirect zur aktuellen Cloudflare-Tunnel-URL.
//
// Diese Seite wird unter https://bildungstag.github.io/w/ ALS index.html UND
// (für beliebige Unterpfade wie /w/station/<uuid>) als 404.html ausgeliefert.
// GitHub Pages serviert 404.html für jeden nicht vorhandenen Pfad – dadurch
// greift dieser Redirect auch für Deep-Links, nicht nur für den Root.
//
// Das Ziel steht in /w/target.js (window.__TARGET) und wird vom Server
// (tunnel_manager.py) bei jedem Tunnel-Wechsel automatisch aktualisiert.
// Wir laden target.js mit einem Cache-Buster, damit ein URL-Wechsel sofort
// durchschlägt und NICHT vom GitHub-CDN-Cache (~10 min) blockiert wird.
// =========================================================================

(function () {
  // GitHub Pages served dieses Repo unter /w/ — fester Prefix.
  var REPO_PREFIX = "w";
  var PLACEHOLDER = "platzhalter";

  function showError() {
    document.getElementById("spinner").style.display = "none";
    document.getElementById("status").textContent = "";
    document.getElementById("error-box").style.display = "block";
  }

  // Realen App-Pfad rekonstruieren: erstes Segment (Repo-Name) entfernen.
  // Funktioniert für index.html (/w/) UND 404.html (/w/station/<uuid>),
  // weil window.location immer den tatsächlich angefragten Pfad enthält.
  var fullPath = window.location.pathname.replace(/^\/+/, "");
  var parts = fullPath.split("/");
  var realPath = (parts[0] === REPO_PREFIX) ? parts.slice(1).join("/") : fullPath;
  var search = window.location.search;
  var hash = window.location.hash;

  function redirect() {
    var target = (typeof window.__TARGET === "string" && window.__TARGET.trim())
      ? window.__TARGET.trim().replace(/\/+$/, "")
      : "";

    // Kein Ziel oder noch der Platzhalter → Fehler statt Weiterleitung ins Leere.
    if (!target || target.indexOf(PLACEHOLDER) !== -1) {
      showError();
      return;
    }

    var dest = target;
    if (realPath) dest += "/" + realPath;
    if (search) dest += search;
    if (hash) dest += hash;

    document.getElementById("url-info").textContent = "→ " + dest;
    setTimeout(function () { window.location.replace(dest); }, 400);
  }

  // target.js cache-bustend nachladen (absoluter Pfad, da 404.html unter
  // beliebigem Pfad ausgeliefert wird und relative URLs sonst brechen).
  var s = document.createElement("script");
  s.src = "/" + REPO_PREFIX + "/target.js?cb=" + Date.now();
  s.onload = redirect;
  s.onerror = showError;
  document.head.appendChild(s);
})();
</script>

</body>
</html>
